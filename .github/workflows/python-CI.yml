---
name: Python Continuous Integration

on:  # yamllint disable-line rule:truthy
    pull_request:
        branches: ["main"]

env:
    # Keep in step with the uv image in packaging/Dockerfile.
    UV_VERSION: "0.11.32"

jobs:
    # Linters and tests at the latest versions requirements.txt allows.
    check:
        runs-on: ubuntu-24.04
        strategy:
            matrix:
                python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        steps:
            - uses: actions/checkout@v5
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install InfraHouse APT repository
              run: |
                sudo make install-infrahouse-repo

            - name: Install dependencies
              run: |
                  make bootstrap

            - name: Linters
              run: |
                  make lint
            - name: Unit tests
              run: |
                  make test

    # Tests at the lowest versions requirements.txt allows, on the oldest supported Python.
    # A floor the code doesn't work with fails here; the latest versions can't show it (issue #206).
    lowest:
        name: "check-lowest (3.10)"
        runs-on: ubuntu-24.04
        env:
            UV_SYSTEM_PYTHON: "true"
        steps:
            - uses: actions/checkout@v5
            - name: Set up Python 3.10
              uses: actions/setup-python@v6
              with:
                  python-version: "3.10"

            - name: Install uv
              run: |
                  python -m pip install "uv==${UV_VERSION}"

            - name: Install the lowest allowed versions
              run: |
                  make bootstrap-lowest

            - name: Unit tests
              run: |
                  make test

    # Also packaging/homebrew/requirements.lock against its requirements.in: make lock regenerates both.
    lock:
        name: "requirements.lock matches requirements.txt"
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Install uv
              run: |
                  python -m pip install "uv==${UV_VERSION}"

            - name: Regenerate requirements.lock
              run: |
                  make lock

            - name: Check requirements.lock is unchanged
              run: |
                  for lock in requirements.lock packaging/homebrew/requirements.lock
                  do
                    if ! git diff --exit-code "${lock}"
                    then
                      echo "::error file=${lock}::${lock} is out of date. Run make lock, commit it."
                      exit 1
                    fi
                  done

    package:
        name: "Standalone package"
        uses: ./.github/workflows/standalone-package.yml

    # The macOS arm64 tarball for the Homebrew formula. Its check is "macOS package / macOS arm64".
    macos:
        name: "macOS package"
        uses: ./.github/workflows/macos-package.yml

    # publish-homebrew's scripts (python-CD.yml): its virtualenv, installed as publish-homebrew installs it, so a
    # broken packaging/homebrew/requirements.lock fails here rather than at a release; pylint on the token script,
    # in that virtualenv, the only one with the infrahouse-core it imports; and its steps against a local release
    # and tap, with gh and the token stubbed (packaging/homebrew/test.sh). Nothing here reaches AWS or the tap.
    homebrew:
        name: "Homebrew formula pull request scripts"
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
              with:
                  persist-credentials: false

            - name: Install infrahouse-core for the token, as publish-homebrew does
              run: packaging/homebrew/install-venv.sh "${RUNNER_TEMP}/homebrew-token"

            - name: pylint on the token script
              run: |
                  pylint="$(grep -E '^pylint *~=' requirements_dev.txt)"
                  "${RUNNER_TEMP}/homebrew-token/bin/pip" install --quiet --disable-pip-version-check "${pylint}"
                  "${RUNNER_TEMP}/homebrew-token/bin/pylint" --rcfile .pylintrc packaging/homebrew/mint_token.py

            - name: Run publish-homebrew's steps against a local release and tap
              run: |
                  make homebrew-test
