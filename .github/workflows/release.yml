---
# Creates the GitHub release when a tag is pushed: make release-* pushes v<version> after the version bump on main.
# The job's own GITHUB_TOKEN creates it. No workflow starts on the release event: publish-macos (python-CD.yml)
# waits for the release by polling it, and then publish-homebrew opens the formula pull request in the tap.
# Credit: https://stackoverflow.com/a/75679739/3209896
name: "Create release"

on:  # yamllint disable-line rule:truthy
    push:
        tags:
            - "*"

permissions:
    contents: write  # gh release create

jobs:
    release:
        name: "Release pushed tag"
        runs-on: "ubuntu-24.04"
        steps:
            - name: "Create release"
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  tag: ${{ github.ref_name }}
              run: |
                  gh release create "$tag" \
                      --repo="$GITHUB_REPOSITORY" \
                      --title="${GITHUB_REPOSITORY#*/} ${tag#v}" \
                      --generate-notes
