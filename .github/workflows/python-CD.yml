# Continuous deployment, on every push to main.
#
# Everything is built and tested before anything is published: the unit and contract tests, the wheel and sdist,
# the standalone Debian package for noble amd64 and arm64, and the macOS arm64 tarball, each smoke-tested on a
# native runner. Then the publish job releases to PyPI and the release repo, but only when this commit bumped the
# version, and only what is still missing. Every push also publishes a candidate build to the testing repo
# (publish-testing). The repository variable RELEASE_PACKAGE=omnibus switches the release repo to the Omnibus
# package, the rollback, and stops the candidates. See packaging/README.md.
#
# The macOS tarball, for the Homebrew formula, goes to the GitHub release instead (publish-macos), on the same
# version bump. That job is independent of publish in both directions, so a macOS failure can't hold back the
# fleet's release, and it doesn't depend on RELEASE_PACKAGE. After it, publish-homebrew opens the pull request in
# infrahouse/homebrew-tap that moves the formula to the release, as a GitHub App whose key is in KMS, through a
# role that only its environment, homebrew-tap, can assume. Nothing needs publish-homebrew.
---
name: Python Continuous Deployment

on:  # yamllint disable-line rule:truthy
    push:
        branches: ["main"]
    workflow_dispatch:
        inputs:
            debug_enabled:
                type: "boolean"
                description: "Setup a temporary SSH access if a test fails"
                required: false
                default: false

# Jobs that need more ask for it themselves.
permissions:
    contents: read

defaults:
    run:
        # bash -eo pipefail: a failing command in a pipeline fails the step.
        shell: bash

env:
    ROLE_ARN: "arn:aws:iam::493370826424:role/ih-tf-infrahouse-toolkit-github"

jobs:
    # What this run would release. The publish jobs read it from here, so every job of a run agrees on it,
    # even if the variable changes while the run is in progress.
    plan:
        name: "Release plan"
        runs-on: ubuntu-24.04
        outputs:
            package: ${{ steps.package.outputs.package }}
            version: ${{ steps.version.outputs.version }}
            bumped: ${{ steps.version.outputs.bumped }}
        steps:
            - uses: actions/checkout@v5
              with:
                  # This commit and its parents, to tell whether this commit bumped the version.
                  fetch-depth: 2

            # Fails the run on any other value. Every publish job needs this one, so nothing is published.
            - name: Check RELEASE_PACKAGE
              id: package
              env:
                  RELEASE_PACKAGE: ${{ vars.RELEASE_PACKAGE }}
              run: |
                  package="${RELEASE_PACKAGE:-standalone}"
                  case "${package}" in
                      standalone|omnibus)
                          echo "The release repo gets the ${package} package"
                          echo "package=${package}" >> "${GITHUB_OUTPUT}"
                          ;;
                      *)
                          echo "::error::RELEASE_PACKAGE is '${RELEASE_PACKAGE}'." \
                              "Unset it, or set it to standalone or omnibus."
                          exit 1
                          ;;
                  esac
                  # On every run's summary, so a switch nobody put back doesn't go unnoticed.
                  if [[ "${package}" == omnibus ]]; then
                      echo "::warning::RELEASE_PACKAGE is omnibus: a release publishes the Omnibus package," \
                          "amd64 only, and no candidate is published. Set it back to standalone after the" \
                          "rollback (packaging/README.md)."
                  fi

            # Only the commit that raises the version releases it. A later push of the same version publishes
            # nothing, even where the release repo lacks an architecture of it: arm64 lacks 2.67.0, and an
            # Omnibus rollback publishes no arm64 at all. A revert of a bump lowers it, and publishes nothing.
            - name: Check whether this commit bumped the version
              id: version
              run: |
                  version_of() {
                      git show "$1:infrahouse_toolkit/__init__.py" | sed -n 's/^__version__ = "\(.*\)"$/\1/p'
                  }
                  version="$(version_of HEAD)"
                  parent_version="$(version_of HEAD^1)"
                  version_pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
                  if [[ ! "${version}" =~ ${version_pattern} || ! "${parent_version}" =~ ${version_pattern} ]]; then
                      echo "::error::Can't read the version: '${version}' at HEAD, '${parent_version}' at HEAD^1"
                      exit 1
                  fi
                  if dpkg --compare-versions "${version}" gt "${parent_version}"; then
                      bumped=true
                  else
                      bumped=false
                  fi
                  echo "Version ${version}, ${parent_version} before this commit: bumped=${bumped}"
                  echo "version=${version}" >> "${GITHUB_OUTPUT}"
                  echo "bumped=${bumped}" >> "${GITHUB_OUTPUT}"

    # Unit and contract tests, and the wheel and sdist that publish uploads to PyPI.
    test:
        name: "Tests, wheel and sdist"
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.13'

            - name: "Setup tmate session"
              uses: "mxschmitt/action-tmate@v3"
              if: "${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}"
              with:
                  limit-access-to-actor: true

            - name: Install InfraHouse APT repository
              run: |
                  sudo make install-infrahouse-repo

            - name: Install dependencies
              run: |
                  make bootstrap

            - name: Unit and contract tests
              run: |
                  make test

            - name: Build the wheel and sdist
              run: |
                  python -m build

            - name: Upload the wheel and sdist
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
              with:
                  name: python-dist
                  path: dist/
                  if-no-files-found: error
                  # A re-run uploads again under the same name. The name is unique within an attempt.
                  overwrite: true

            # Coverage reporting isn't part of the release, so an outage there doesn't block one.
            - name: Run codacy-coverage-reporter
              continue-on-error: true
              uses: codacy/codacy-coverage-reporter-action@v1
              with:
                  project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
                  coverage-reports: "coverage.xml"

    # The released package: the standalone build without a version suffix, for example 2.68.0-1.
    # publish puts it in the release repo.
    standalone:
        name: "Standalone package (release)"
        uses: ./.github/workflows/standalone-package.yml
        with:
            package_version_suffix: ""
            # publish downloads infrahouse-toolkit-release-noble-*, publish-testing
            # infrahouse-toolkit-candidate-noble-*: neither pattern matches the other's artifacts.
            artifact_prefix: "infrahouse-toolkit-release-noble"

    # The same build with a candidate version, for example 2.68.0+candidate.214.1-1. publish-testing puts it
    # in the testing repo, never in the release repo, and not at all under RELEASE_PACKAGE=omnibus.
    standalone-candidate:
        name: "Standalone package (candidate)"
        uses: ./.github/workflows/standalone-package.yml
        with:
            # Above the release of the same toolkit version, below the next one, and new on every run and
            # re-run. Keep in step with PACKAGE_VERSION_SUFFIX in publish-testing.
            package_version_suffix: "+candidate.${{ github.run_number }}.${{ github.run_attempt }}"
            artifact_prefix: "infrahouse-toolkit-candidate-noble"

    # The macOS arm64 tarball for the Homebrew formula, and its .sha256. publish-macos attaches both to the GitHub
    # release. Nothing else needs it: publish and publish-testing don't wait for it.
    macos:
        name: "macOS package"
        uses: ./.github/workflows/macos-package.yml
        with:
            # publish-macos downloads infrahouse-toolkit-macos-arm64, which matches neither
            # infrahouse-toolkit-release-noble-* (publish) nor infrahouse-toolkit-candidate-noble-* (publish-testing).
            artifact_prefix: "infrahouse-toolkit-macos"

    # The rollback (IH-186): the Omnibus package, noble amd64 only, built only when RELEASE_PACKAGE is omnibus.
    # Outside main this builds it without publishing it, which checks the rollback still builds.
    omnibus:
        name: "Omnibus package (rollback)"
        needs: plan
        if: needs.plan.outputs.package == 'omnibus'
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5

            - name: Build the Omnibus package
              run: |
                  OS_VERSION=noble make package

            - name: Upload the package
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
              with:
                  name: infrahouse-toolkit-omnibus-noble-amd64
                  path: omnibus-infrahouse-toolkit/pkg/infrahouse-toolkit_*.deb
                  if-no-files-found: error
                  # A re-run uploads again under the same name. The name is unique within an attempt.
                  overwrite: true

    # The release: PyPI, and the release repo (https://release-noble.infrahouse.com/, codename noble), which
    # every node installs from with Puppet's ensure => latest. It runs only on main, only when this commit
    # bumped the version, and only after the tests and the release builds passed, both standalone packages
    # included, whichever package the release repo gets. Each target is published only when it lacks this
    # version, so a re-run finishes a release that failed halfway and publishes nothing twice.
    publish:
        name: "Publish the release to PyPI and noble"
        needs: [plan, test, standalone, omnibus]
        # !cancelled() instead of the implicit success(): omnibus is skipped when the release is standalone,
        # which would skip this job too. Each result is checked instead.
        if: >-
            github.ref == 'refs/heads/main'
            && !cancelled()
            && needs.plan.result == 'success'
            && needs.plan.outputs.bumped == 'true'
            && needs.test.result == 'success'
            && needs.standalone.result == 'success'
            && (needs.plan.outputs.package == 'standalone' || needs.omnibus.result == 'success')
        runs-on: ubuntu-24.04
        # reprepro rewrites the repository's indexes on every upload, so one writer at a time. A running publish
        # is never cancelled: reprepro stopped mid-write can leave the repository locked or half-written.
        concurrency:
            group: release-repo-noble
            cancel-in-progress: false
        permissions:
            contents: read  # actions/checkout
            id-token: write  # aws-actions/configure-aws-credentials
        env:
            RELEASE_PACKAGE: ${{ needs.plan.outputs.package }}
            VERSION: ${{ needs.plan.outputs.version }}
            RELEASE_POOL_URL: "https://release-noble.infrahouse.com/pool/main/i/infrahouse-toolkit"
        steps:
            - uses: actions/checkout@v5

            - name: Download the wheel and sdist
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
              with:
                  name: python-dist
                  path: dist

            - name: Download the standalone packages
              if: env.RELEASE_PACKAGE == 'standalone'
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
              with:
                  pattern: infrahouse-toolkit-release-noble-*
                  path: release
                  merge-multiple: true

            - name: Download the Omnibus package
              if: env.RELEASE_PACKAGE == 'omnibus'
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
              with:
                  name: infrahouse-toolkit-omnibus-noble-amd64
                  path: release

            # A package with any other version, a candidate's included, would reach every node within about
            # 30 minutes, and Puppet never downgrades.
            - name: Check the wheel, the sdist and one package per architecture, with this version
              run: |
                  case "${RELEASE_PACKAGE}" in
                      standalone) architectures=(amd64 arm64) ;;
                      omnibus) architectures=(amd64) ;;
                      *) echo "::error::Unknown release package '${RELEASE_PACKAGE}'"; exit 1 ;;
                  esac
                  ls -l dist release

                  expected_dist=(
                      "dist/infrahouse_toolkit-${VERSION}-py3-none-any.whl"
                      "dist/infrahouse_toolkit-${VERSION}.tar.gz"
                  )
                  count="$(find dist -type f | wc -l)"
                  if [[ "${count}" -ne "${#expected_dist[@]}" ]]; then
                      echo "::error::Expected the wheel and the sdist in dist, found ${count} files"
                      exit 1
                  fi
                  for file in "${expected_dist[@]}"; do
                      if [[ ! -f "${file}" ]]; then
                          echo "::error::${file} is missing"
                          exit 1
                      fi
                  done

                  expected="${VERSION}-1"
                  count="$(find release -type f | wc -l)"
                  if [[ "${count}" -ne "${#architectures[@]}" ]]; then
                      echo "::error::Expected one ${RELEASE_PACKAGE} package per architecture" \
                          "(${architectures[*]}), found ${count} files"
                      exit 1
                  fi
                  for arch in "${architectures[@]}"; do
                      deb="release/infrahouse-toolkit_${expected}_${arch}.deb"
                      if [[ ! -f "${deb}" ]]; then
                          echo "::error::${deb} is missing"
                          exit 1
                      fi
                      package="$(dpkg-deb -f "${deb}" Package)"
                      version="$(dpkg-deb -f "${deb}" Version)"
                      architecture="$(dpkg-deb -f "${deb}" Architecture)"
                      echo "${deb}: ${package} ${version} ${architecture}"
                      if [[ "${package}" != "infrahouse-toolkit" || "${version}" != "${expected}" \
                            || "${architecture}" != "${arch}" ]]; then
                          echo "::error::${deb} is ${package} ${version} ${architecture}," \
                              "expected infrahouse-toolkit ${expected} ${arch}"
                          exit 1
                      fi
                  done
                  echo "ARCHITECTURES=${architectures[*]}" >> "${GITHUB_ENV}"

            # Anything but a clear answer (DNS, connection, timeout, 5xx after the retries) fails the job,
            # rather than publishing a version that may be there or skipping one that may not.
            - name: Check what this release still lacks
              run: |
                  # Prints the HTTP status of a HEAD request. curl exits non-zero when it gets no response.
                  http_status() {
                      curl --silent --show-error --head --output /dev/null --write-out '%{http_code}' \
                          --max-time 30 --retry 3 --retry-delay 5 --retry-connrefused "$1"
                  }

                  url="https://pypi.org/pypi/infrahouse-toolkit/${VERSION}/json"
                  if ! status="$(http_status "${url}")"; then
                      echo "::error::No response from ${url}"
                      exit 1
                  fi
                  case "${status}" in
                      200) echo "PyPI has ${VERSION}"; publish_pypi=no ;;
                      404) echo "PyPI lacks ${VERSION}"; publish_pypi=yes ;;
                      *) echo "::error::${url} returned ${status}"; exit 1 ;;
                  esac

                  read -ra architectures <<< "${ARCHITECTURES}"
                  publish_architectures=()
                  published_architectures=()
                  # All architectures, not only this release's: the check below compares the ones already
                  # published with this release's package.
                  for arch in amd64 arm64; do
                      url="${RELEASE_POOL_URL}/infrahouse-toolkit_${VERSION}-1_${arch}.deb"
                      if ! status="$(http_status "${url}")"; then
                          echo "::error::No response from ${url}"
                          exit 1
                      fi
                      case "${status}" in
                          200)
                              echo "The release repo has ${VERSION} for ${arch}"
                              published_architectures+=("${arch}")
                              ;;
                          # The repository is an S3 bucket behind CloudFront that can't list it, so a missing
                          # file is 403, not 404.
                          403|404)
                              echo "The release repo lacks ${VERSION} for ${arch}"
                              if [[ " ${architectures[*]} " == *" ${arch} "* ]]; then
                                  publish_architectures+=("${arch}")
                              fi
                              ;;
                          *)
                              echo "::error::${url} returned ${status}"
                              exit 1
                              ;;
                      esac
                  done

                  echo "Publish to PyPI: ${publish_pypi}. To the release repo: ${publish_architectures[*]:-nothing}."
                  {
                      echo "PUBLISH_PYPI=${publish_pypi}"
                      echo "PUBLISH_ARCHITECTURES=${publish_architectures[*]}"
                      echo "PUBLISHED_ARCHITECTURES=${published_architectures[*]}"
                  } >> "${GITHUB_ENV}"

            # One version is one kind of package on every architecture. Otherwise a re-run after switching
            # RELEASE_PACKAGE could add a standalone arm64 to an Omnibus amd64 release, or the other way round.
            - name: Check the architectures already published are the same package
              if: env.PUBLISH_ARCHITECTURES != '' && env.PUBLISHED_ARCHITECTURES != ''
              run: |
                  read -ra publish_architectures <<< "${PUBLISH_ARCHITECTURES}"
                  read -ra published_architectures <<< "${PUBLISHED_ARCHITECTURES}"
                  reference="release/infrahouse-toolkit_${VERSION}-1_${publish_architectures[0]}.deb"
                  expected="$(dpkg-deb -f "${reference}" Description)"
                  mkdir -p published
                  for arch in "${published_architectures[@]}"; do
                      url="${RELEASE_POOL_URL}/infrahouse-toolkit_${VERSION}-1_${arch}.deb"
                      deb="published/infrahouse-toolkit_${VERSION}-1_${arch}.deb"
                      if ! curl --fail --silent --show-error --location --max-time 600 --retry 3 --retry-delay 5 \
                              --output "${deb}" "${url}"; then
                          echo "::error::Couldn't download ${url} to compare it with this release's package"
                          exit 1
                      fi
                      description="$(dpkg-deb -f "${deb}" Description)"
                      if [[ "${description}" != "${expected}" ]]; then
                          echo "::error::${VERSION} for ${arch} is already a different package. Published:"
                          echo "${description}"
                          echo "This release's ${RELEASE_PACKAGE} package:"
                          echo "${expected}"
                          exit 1
                      fi
                      echo "${VERSION} for ${arch} is the same package as this release's ${RELEASE_PACKAGE} one"
                  done

            # Before any publish, so a failure here leaves nothing half-published.
            - name: Install InfraHouse APT repository
              if: env.PUBLISH_ARCHITECTURES != ''
              run: |
                  sudo make install-infrahouse-repo
                  sudo apt-get -y install infrahouse-toolkit

            - name: Publish to PyPI
              if: env.PUBLISH_PYPI == 'yes'
              uses: pypa/gh-action-pypi-publish@ab69e431e9c9f48a3310be0a56527c679f56e04d
              with:
                  user: __token__
                  password: ${{ secrets.PYPI_API_TOKEN }}
                  # The check above found PyPI without this version. This covers PyPI's JSON API lagging
                  # behind an upload that an earlier attempt made a moment before.
                  skip-existing: true

            # After the PyPI publish, so that step never sees AWS credentials.
            - name: Configure AWS Credentials
              if: env.PUBLISH_ARCHITECTURES != ''
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
              with:
                  role-to-assume: ${{ env.ROLE_ARN }}
                  role-session-name: github-action-infrahouse-toolkit-cd
                  aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

            # The release repo: bucket infrahouse-release-noble, codename noble, and its own key secrets.
            # The released ih-s3-reprepro's includedeb takes one package, so one call per architecture,
            # amd64 first: that's where the fleet is.
            - name: Publish to noble
              if: env.PUBLISH_ARCHITECTURES != ''
              run: |
                  read -ra publish_architectures <<< "${PUBLISH_ARCHITECTURES}"
                  for arch in "${publish_architectures[@]}"; do
                      ih-s3-reprepro \
                        --aws-region "${AWS_DEFAULT_REGION}" \
                        --bucket infrahouse-release-noble \
                        --gpg-key-secret-id packager-key-noble \
                        --gpg-passphrase-secret-id packager-passphrase-noble \
                        includedeb \
                        noble \
                        "release/infrahouse-toolkit_${VERSION}-1_${arch}.deb"
                  done

    # Publishes the candidate to the testing repo (https://testing-noble.infrahouse.com/, codename
    # noble-testing), which only canary nodes use. See packaging/README.md.
    publish-testing:
        name: "Publish the candidate to noble-testing"
        # plan: an invalid RELEASE_PACKAGE stops this publish too.
        needs: [plan, standalone-candidate]
        # A workflow_dispatch on another branch builds a candidate but doesn't publish it. Neither does a run
        # under omnibus: a rollback's candidate would sort above the rollback (2.68.1+candidate.N.1-1 >
        # 2.68.1-1), and canary nodes would keep the standalone package. Without it the newest candidate is the
        # bad release's, below the rollback, so canaries roll back with the fleet.
        if: github.ref == 'refs/heads/main' && needs.plan.outputs.package == 'standalone'
        runs-on: ubuntu-24.04
        # reprepro rewrites the repository's indexes on every upload, so one writer at a time. A running publish
        # is never cancelled: reprepro stopped mid-write can leave the repository locked or half-written.
        concurrency:
            group: testing-repo-noble
            cancel-in-progress: false
        permissions:
            contents: read  # actions/checkout
            id-token: write  # aws-actions/configure-aws-credentials
        env:
            # The suffix standalone-candidate built with. Keep in step with its package_version_suffix.
            PACKAGE_VERSION_SUFFIX: "+candidate.${{ github.run_number }}.${{ github.run_attempt }}"
        steps:
            - uses: actions/checkout@v5

            - name: Download the candidates
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
              with:
                  pattern: infrahouse-toolkit-candidate-noble-*
                  path: candidates
                  merge-multiple: true

            # A package without the suffix would carry a release version, which canary nodes would then see
            # in both repos with different contents.
            - name: Check there is one candidate per architecture, with this run's version
              run: |
                  ls -l candidates
                  toolkit_version="$(python3 -c 'import infrahouse_toolkit; print(infrahouse_toolkit.__version__)')"
                  expected="${toolkit_version}${PACKAGE_VERSION_SUFFIX}-1"
                  count="$(find candidates -type f -name '*.deb' | wc -l)"
                  if [[ "${count}" -ne 2 ]]; then
                      echo "::error::Expected 2 .deb files, one per architecture, found ${count}"
                      exit 1
                  fi
                  for arch in amd64 arm64; do
                      deb="candidates/infrahouse-toolkit_${expected}_${arch}.deb"
                      if [[ ! -f "${deb}" ]]; then
                          echo "::error::${deb} is missing"
                          exit 1
                      fi
                      package="$(dpkg-deb -f "${deb}" Package)"
                      version="$(dpkg-deb -f "${deb}" Version)"
                      architecture="$(dpkg-deb -f "${deb}" Architecture)"
                      echo "${deb}: ${package} ${version} ${architecture}"
                      if [[ "${package}" != "infrahouse-toolkit" || "${version}" != "${expected}" \
                            || "${architecture}" != "${arch}" ]]; then
                          echo "::error::${deb} is ${package} ${version} ${architecture}, expected ${expected} ${arch}"
                          exit 1
                      fi
                  done
                  echo "CANDIDATE_VERSION=${expected}" >> "${GITHUB_ENV}"

            - name: Install InfraHouse APT repository
              run: |
                  sudo make install-infrahouse-repo
                  sudo apt-get -y install infrahouse-toolkit

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
              with:
                  role-to-assume: ${{ env.ROLE_ARN }}
                  role-session-name: github-action-infrahouse-toolkit-publish-testing
                  aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

            # The testing repo: bucket infrahouse-testing-noble, codename noble-testing, and its own key secrets.
            # The released ih-s3-reprepro's includedeb takes one package, so one call per architecture.
            - name: Publish the candidates to noble-testing
              run: |
                  for arch in amd64 arm64; do
                      ih-s3-reprepro \
                        --aws-region "${AWS_DEFAULT_REGION}" \
                        --bucket infrahouse-testing-noble \
                        --gpg-key-secret-id packager-key-noble-testing \
                        --gpg-passphrase-secret-id packager-passphrase-noble-testing \
                        includedeb \
                        noble-testing \
                        "candidates/infrahouse-toolkit_${CANDIDATE_VERSION}_${arch}.deb"
                  done

    # Attaches the macOS tarball and its .sha256 to the GitHub release v<version>, where the Homebrew formula
    # downloads it. Only on main, only when this commit bumped the version, and only after the unit tests and the
    # macOS build passed. Neither publish nor publish-testing waits for it, and it waits for neither: a macOS runner
    # outage can't hold back the fleet's release, and a failure here still fails the run. It runs whatever
    # RELEASE_PACKAGE says, which chooses the apt repo's package. Its only write permission is contents: write for
    # the release; it has no AWS role and no PyPI token.
    publish-macos:
        name: "Attach the macOS tarball to the GitHub release"
        needs: [plan, test, macos]
        if: github.ref == 'refs/heads/main' && needs.plan.outputs.bumped == 'true'
        runs-on: ubuntu-24.04
        # One attempt at a time, so two can't both find the release without the files and both upload.
        concurrency:
            group: github-release-macos
            cancel-in-progress: false
        permissions:
            contents: write  # gh release upload
        env:
            VERSION: ${{ needs.plan.outputs.version }}
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
        steps:
            - name: Download the tarball and its .sha256
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
              with:
                  name: infrahouse-toolkit-macos-arm64
                  path: macos

            # The formula's url names the version, and IH-190 reads the checksum from the .sha256.
            - name: Check there is one tarball and one .sha256, for this version, and that they match
              run: |
                  tarball="infrahouse-toolkit-${VERSION}-macos-arm64.tar.gz"
                  ls -l macos
                  count="$(find macos -type f | wc -l)"
                  if [[ "${count}" -ne 2 ]]; then
                      echo "::error::Expected ${tarball} and its .sha256, found ${count} files"
                      exit 1
                  fi
                  for file in "macos/${tarball}" "macos/${tarball}.sha256"; do
                      if [[ ! -f "${file}" ]]; then
                          echo "::error::${file} is missing"
                          exit 1
                      fi
                  done
                  # One line, as shasum -a 256 writes it, with the file name and no directory.
                  line_pattern='^[0-9a-f]{64}  (.+)$'
                  if [[ "$(wc -l < "macos/${tarball}.sha256")" -ne 1 \
                        || ! "$(cat "macos/${tarball}.sha256")" =~ ${line_pattern} \
                        || "${BASH_REMATCH[1]}" != "${tarball}" ]]; then
                      echo "::error::${tarball}.sha256 isn't one line '<sha256>  ${tarball}'. It is:"
                      cat "macos/${tarball}.sha256"
                      exit 1
                  fi
                  (cd macos && sha256sum --check --strict "${tarball}.sha256")

            # release.yml creates the release when the tag is pushed, which comes after this push to main
            # (git push && git push --tags). Anything but "release not found" fails the job at once.
            - name: Wait for the GitHub release v${{ needs.plan.outputs.version }}
              run: |
                  tag="v${VERSION}"
                  deadline=$((SECONDS + 15 * 60))
                  while true; do
                      if error="$(gh release view "${tag}" --json tagName 2>&1 >/dev/null)"; then
                          echo "Release ${tag} exists"
                          break
                      fi
                      if [[ "${error}" != "release not found" ]]; then
                          echo "::error::gh release view ${tag} failed: ${error}"
                          exit 1
                      fi
                      if (( SECONDS >= deadline )); then
                          echo "::error::Release ${tag} doesn't exist after 15 minutes. release.yml creates it when" \
                              "the tag ${tag} is pushed: push it (git push --tags), check release.yml's run, then" \
                              "re-run this job."
                          exit 1
                      fi
                      echo "Release ${tag} doesn't exist yet; checking again in 30 seconds"
                      sleep 30
                  done
                  # The tarball was built from this commit, so the release must be this commit's.
                  tag_commit="$(gh api "repos/${GH_REPO}/commits/${tag}" --jq .sha)"
                  if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
                      echo "::error::Tag ${tag} is commit ${tag_commit}, but this run built ${GITHUB_SHA}"
                      exit 1
                  fi

            # Never replaces an asset: builds aren't byte-reproducible, and a formula may already pin the first
            # upload's checksum. No --clobber, so gh refuses to overwrite one that appears meanwhile.
            - name: Attach the tarball and its .sha256, unless the release has them
              run: |
                  tag="v${VERSION}"
                  tarball="infrahouse-toolkit-${VERSION}-macos-arm64.tar.gz"
                  assets="$(gh release view "${tag}" --json assets --jq '.assets[].name')"
                  has_asset() {
                      grep -qxF -- "$1" <<< "${assets}"
                  }
                  if has_asset "${tarball}" && has_asset "${tarball}.sha256"; then
                      echo "::notice::Release ${tag} already has ${tarball} and its .sha256. Uploading nothing:" \
                          "this build's tarball differs, and the formula may pin the release's checksum."
                      exit 0
                  fi
                  for file in "${tarball}" "${tarball}.sha256"; do
                      if has_asset "${file}"; then
                          echo "::error::Release ${tag} has ${file} but not the other file of the pair. Check it," \
                              "delete it (gh release delete-asset ${tag} ${file}) and re-run this job."
                          exit 1
                      fi
                  done
                  # The tarball first, so the .sha256 appears only once the file it describes is complete.
                  gh release upload "${tag}" "macos/${tarball}"
                  gh release upload "${tag}" "macos/${tarball}.sha256"
                  echo "Attached ${tarball} and its .sha256 to ${tag}"

            # What users download, whether this attempt uploaded it or an earlier one did.
            - name: Check the release's tarball matches its .sha256
              run: |
                  tag="v${VERSION}"
                  tarball="infrahouse-toolkit-${VERSION}-macos-arm64.tar.gz"
                  gh release download "${tag}" --dir released --pattern "${tarball}" --pattern "${tarball}.sha256"
                  (cd released && sha256sum --check --strict "${tarball}.sha256")

    # Opens the pull request in infrahouse/homebrew-tap that moves the formula to this release, or updates the one
    # that is open, once publish-macos attached the tarball. It needs publish-macos, and nothing needs it: it can't
    # hold back or change PyPI, the apt repositories or the tarball. The tap's CI ("infrahouse-toolkit formula")
    # installs and tests the formula on the pull request, and Aleks merges it.
    #
    # It writes to the tap as the GitHub App infrahouse-homebrew-tap, installed there only. The App's private key is
    # in KMS, and only HOMEBREW_TAP_ROLE_ARN may sign with it. That role trusts this repository's OIDC subject for the
    # environment homebrew-tap, nothing else: only this job names the environment, which allows main only
    # (github-control). The token is minted, masked and used in one step, down-scoped to contents and pull_requests
    # write. See "How a release reaches the Homebrew formula" in packaging/README.md.
    publish-homebrew:
        name: "Open the formula pull request in the Homebrew tap"
        needs: [plan, publish-macos]
        if: >-
            github.ref == 'refs/heads/main'
            && needs.plan.outputs.bumped == 'true'
            && needs.publish-macos.result == 'success'
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        # The OIDC subject is repo:infrahouse/infrahouse-toolkit:environment:homebrew-tap, the one the role trusts.
        environment: homebrew-tap
        # One at a time, so two runs can't both push toolkit-<version> or both open its pull request. A running one is
        # never cancelled.
        concurrency:
            group: homebrew-tap-formula
            cancel-in-progress: false
        permissions:
            contents: read  # actions/checkout
            id-token: write  # aws-actions/configure-aws-credentials
        env:
            VERSION: ${{ needs.plan.outputs.version }}
            # Not secrets (IH-190): the App, the alias of the KMS key that holds its private key, and the only role
            # that may sign with it (aws-control-493370826424).
            HOMEBREW_TAP_APP_ID: "5944221"
            HOMEBREW_TAP_KMS_ALIAS_ARN: "arn:aws:kms:us-west-1:493370826424:alias/github-app-infrahouse-homebrew-tap"
            HOMEBREW_TAP_ROLE_ARN: "arn:aws:iam::493370826424:role/ih-tf-infrahouse-toolkit-homebrew"
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
              with:
                  # Nothing here pushes to this repository, so its token stays out of .git/config.
                  persist-credentials: false

            # The formula gets the checksum of the file users download, not this run's build.
            - name: Check the release's tarball against its .sha256
              id: release
              run: packaging/homebrew/check-release.sh

            - name: Install infrahouse-core for the token, in a virtualenv of its own
              run: packaging/homebrew/install-venv.sh "${RUNNER_TEMP}/homebrew-token"

            - name: Assume the role that may sign as the App
              id: aws
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
              with:
                  role-to-assume: ${{ env.HOMEBREW_TAP_ROLE_ARN }}
                  role-session-name: github-action-infrahouse-toolkit-publish-homebrew
                  aws-region: us-west-1

            - name: Explain a refused role
              if: failure() && steps.aws.outcome == 'failure'
              run: |
                  echo "::error::Couldn't assume ${HOMEBREW_TAP_ROLE_ARN}. It trusts only the OIDC subject" \
                      "repo:infrahouse/infrahouse-toolkit:environment:homebrew-tap: check that" \
                      "aws-control-493370826424 created it, then re-run publish-homebrew."

            # One script: the token is minted, masked and used here, and nowhere else.
            - name: Open or update the formula pull request
              env:
                  TARBALL_SHA256: ${{ steps.release.outputs.sha256 }}
                  HOMEBREW_TOKEN_PYTHON: ${{ runner.temp }}/homebrew-token/bin/python
              run: packaging/homebrew/open-formula-pr.sh
