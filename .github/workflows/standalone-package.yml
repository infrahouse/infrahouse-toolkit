---
# Builds the standalone Debian package for noble on amd64 and arm64, each on a native runner,
# smoke-tests it on a clean ubuntu:noble container and uploads it as a workflow artifact.
# It publishes nothing itself. python-CI.yml calls it once, with the plain toolkit version. python-CD.yml calls it
# twice: for the release, with the plain version (its publish job publishes to the release repo), and for a
# candidate, with a version suffix (its publish-testing job publishes to the testing repo).
name: Standalone package

on:  # yamllint disable-line rule:truthy
    workflow_call:
        inputs:
            package_version_suffix:
                description: >-
                    Appended to the toolkit version in the Debian version, e.g. +candidate.214.1.
                    Empty builds the plain toolkit version. See PACKAGE_VERSION_SUFFIX in packaging/build.sh.
                type: string
                required: false
                default: ""
            artifact_prefix:
                description: >-
                    The artifacts are named <artifact_prefix>-<arch>. A caller that calls this workflow more than
                    once in a run gives each call its own prefix, so a publish job can't download the other
                    call's packages.
                type: string
                required: false
                default: "infrahouse-toolkit-noble"

permissions:
    contents: read

jobs:
    package:
        name: "noble ${{ matrix.arch }}"
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-24.04
                    - arch: arm64
                      runner: ubuntu-24.04-arm
        steps:
            - uses: actions/checkout@v5

            - name: Check the runner is native ${{ matrix.arch }}
              run: |
                  uname -m
                  dpkg --print-architecture
                  test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"

            - name: Build the package
              env:
                  PACKAGE_VERSION_SUFFIX: ${{ inputs.package_version_suffix }}
              run: |
                  make package-standalone

            - name: Smoke-test the package on a clean ubuntu:noble
              run: |
                  make package-smoke-test

            - name: Upload the package
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
              with:
                  name: ${{ inputs.artifact_prefix }}-${{ matrix.arch }}
                  path: dist/infrahouse-toolkit_*.deb
                  if-no-files-found: error
